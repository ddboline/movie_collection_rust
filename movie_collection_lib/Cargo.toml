[package]
name = "movie_collection_lib"
version = "0.12.50"
authors = ["Daniel Boline <ddboline@gmail.com>"]
edition = "2018"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
bytes = "1.11"
clap = {version="4.6", features=["derive"]}
derive_more = {version="2.1", features=["full"]}
dirs = "7.0"
dotenvy = "0.15"
deadpool = "0.13"
deadpool-postgres = "0.14"
envy = "0.4"
futures = "0.3"
itertools = "0.15"
jwalk = "0.9"
log = "0.4"
maplit = "1.0"
postgres_query = {git = "https://github.com/ddboline/rust-postgres-query", tag = "0.3.9", features=["deadpool"]}
postgres-types = "0.2"
procfs = "0.18"
rand = "0.10"
rayon = "1.12"
reqwest = {version="0.13", features=["cookies", "json"]}
roxmltree = "0.21"
rust_decimal = {version="1.43", features=["db-tokio-postgres", "macros"]}
select = "0.6"
serde = {version="1.0", features=["derive"]}
serde_json = "1.0"
slug = "0.1"
smallvec = {version="1.16", features=["serde", "write"]}
stack-string = { version="1.2", features=["postgres_types"] }
stdout-channel = "0.6"
thiserror = "2.0"
time = {version="0.3", features=["serde-human-readable", "macros", "formatting"]}
time-tz = {version="2.0", features=["system"]}
tokio-postgres = {version="0.7", features=["with-uuid-1", "with-time-0_3", "with-serde_json-1"]}
tokio = {version="1.54", features=["rt", "macros", "rt-multi-thread", "process"]}
tokio-stream = {version="0.1", features=["fs"]}
uuid = "1.29"
